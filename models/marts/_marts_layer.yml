models:
  - name: dim_player
    description: One row per player appearing in recorded ATP or WTA matches from January 1, 2000 onward, with available identity and biographical attributes.
    columns:
      - name: player_id
        description: Canonical identifier for the player across match and biographical records.
        data_tests:
          - not_null
          - unique
      - name: player_name
        description: Full name under which the player appears in match records.
        data_tests:
          - not_null
      - name: gender
        description: Player gender category associated with the professional tour, where F represents WTA and M represents ATP.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["F", "M"]
      - name: hand
        description: Dominant playing hand of the player, when available.
      - name: height
        description: Height of the player in centimeters, when available.
      - name: weight
        description: Weight of the player in kilograms, when available.
      - name: birthdate
        description: Date the player was born, when available.
      - name: birthplace
        description: City and country where the player was born, when available.
      - name: year_turned_pro
        description: Year the player turned professional, when available.
      - name: country_code
        description: Three-letter IOC code for the country the player represents, when available.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or length(country_code) = 3"
      - name: bio_source
        description: Whether the player's profile attributes are matched to a biography record or are available only from match history.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["players_bio", "matches_only"]
  

  - name: dim_tourney
    description: One row per distinct observed combination of ATP or WTA tournament identifier, date, tour, venue conditions, draw details, and champion where a completed final is available. Source tournament identifiers can recur across multiple recorded attribute combinations.
    columns:
      - name: tourney_id
        description: Reusable source identifier for the tournament. It is required but not a primary key because one identifier can appear across multiple recorded dates or attribute combinations.
        data_tests:
          - not_null
          - unique
      - name: tourney_name
        description: Name of the tournament.
        data_tests:
          - not_null
      - name: tour
        description: Professional tennis tour on which the tournament was played.
      - name: surface
        description: Court surface used for the tournament.
      - name: draw_size
        description: Number of player positions in the tournament draw.
      - name: tourney_level
        description: Competition tier of the tournament within its professional tour.
      - name: indoor
        description: Whether the tournament was played indoors.
      - name: tourney_start_date
        description: Start date of the tournament edition.

      - name: tourney_winner
        description: Name of the player who won the tournament.

  - name: fact_player_match
    description: >-
      One row per player's participation in a recorded ATP or WTA match from
      January 1, 2000 onward. Contains match context, player attributes as
      recorded at match time, and player-level serve statistics for analysis.
    columns:
      - name: player_match_id
        data_type: varchar
        description: Unique identifier for a player's participation in a recorded match.
        data_tests:
          - not_null
          - unique
      - name: match_id
        data_type: varchar
        description: "{{ doc('match_id') }}"
        data_tests:
          - not_null
      - name: tourney_id
        data_type: varchar
        description: Foreign key identifying the tournament edition in which the match was played.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tourney')
                field: tourney_id
      - name: surface
        data_type: varchar
        description: >-
          Court surface on which the match was played. Stored at match grain
          because team competitions such as the Davis Cup and Billie Jean King
          Cup can contain matches played on different surfaces within the same
          canonical tournament grouping.
      - name: player_id
        data_type: varchar
        description: Foreign key identifying the player represented by this fact row.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_id
      - name: opponent_id
        data_type: varchar
        description: Foreign key identifying the opposing player in the match.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_id
      - name: tourney_match_num
        data_type: number
        description: "{{ doc('tourney_match_num') }}"
      - name: result
        data_type: varchar
        description: Whether the player represented by the row won or lost the match.
      - name: round
        data_type: varchar
        description: "{{ doc('round') }}"
      - name: score
        data_type: varchar
        description: "{{ doc('score') }}"
      - name: best_of
        data_type: number
        description: "{{ doc('best_of') }}"
      - name: match_duration
        data_type: number
        description: "{{ doc('match_duration') }}"
      - name: match_status
        data_type: varchar
        description: Recorded outcome status of the match, such as completed, retired, defaulted, or walkover.
      - name: player_seed
        data_type: number
        description: Tournament seed assigned to the player, when seeded.
      - name: player_entry
        data_type: varchar
        description: Source entry code describing how the player entered the tournament draw.
      - name: player_entry_category
        data_type: varchar
        description: Standardised category describing how the player entered the tournament draw.
        data_tests:
          - accepted_values:
              arguments:
                values: ["ALT", "PR", "ITF", "WC", "Q", "LL", "SE", "UP", "NG"]
      - name: player_age
        data_type: float
        description: Age of the player at the time of the match.
      - name: player_rank
        data_type: number
        description: ATP or WTA ranking of the player at the time of the match.
      - name: player_rank_points
        data_type: number
        description: ATP or WTA ranking points held by the player at the time of the match.
      - name: ace
        data_type: number
        description: Aces served by the player during the match.
      - name: double_fault
        data_type: number
        description: Double faults served by the player during the match.
      - name: total_service_points
        data_type: number
        description: Total service points played by the player during the match.
      - name: first_serve_in
        data_type: number
        description: First serves made by the player during the match.
      - name: first_serve_won
        data_type: number
        description: First-serve points won by the player during the match.
      - name: second_serve_won
        data_type: number
        description: Second-serve points won by the player during the match.
      - name: service_games
        data_type: number
        description: Service games played by the player during the match.
      - name: bp_saved
        data_type: number
        description: Break points saved by the player during the match.
      - name: bp_faced
        data_type: number
        description: Break points faced by the player during the match.
