version: 2

models:
  - name: stg_players_bio
    description: "Player biographical attributes staged from the raw players feed. Records sharing a player ID, case-insensitive player name, birth date, birthplace, and IOC country code are deduplicated, ordered by ATP-formatted name."
    columns:
      - name: player_id
        description: "Source identifier for the player."
        data_tests:
          - not_null
          - unique
      - name: player_name
        description: "Player's full name."
        data_tests:
          - not_null
      - name: atpname
        description: "Player's name as published by the ATP."
      - name: birthdate
        description: "Date the player was born. Converted from the source YYYYMMDD value to a date."
      - name: weight
        description: "Player's weight in kilograms."
      - name: height
        description: "Player's height in centimeters."
      - name: year_turned_pro
        description: "Year the player turned professional."
      - name: birthplace
        description: "City and country where the player was born."
      - name: coaches
        description: "Name or names of the player's coaches, with surrounding whitespace removed and blank values normalised to null."
      - name: player_hand
        description: "{{ doc('player_hand') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ["R", "L", "A", "U"]
      - name: player_backhand
        description: "{{ doc('player_backhand')}}"
        data_tests:
          - accepted_values:
              arguments:
                values: ["1H", "2H", "Unknown"]
      - name: country_code
        description: "Three-letter IOC code for the country the player represents, with surrounding white space removed and blank values normalised to null"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
               expression: "is null or length(country_code)= 3"
