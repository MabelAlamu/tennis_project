version: 2

seeds:
  - name: atp_player_id_corrections
    description: >
      Row-level corrections for player_ids incorrectly shared between two different real players in atp_matches (e.g. one id mostly belonging
      to one player, with a stray row mislabeled under a different player's name). Scoped by (bad_player_id, player_name) so only the
      mislabeled rows are corrected, not every row under the shared id.
    columns:
      - name: bad_player_id
        description: Player identifier incorrectly assigned to the named player in teh raw ATP macth data
      - name: player_name
        description: Player name associated with the incorrect ATP player identifier.
      - name: correct_player_id
        description: Canonical ATP plaer identifier for the named player.


  - name: atp_player_id_merge_map
    description: >
      Maps a player_id with no corresponding players_bio row to the correct player_id for the same real person, where the
      same player was found recorded under two different ids.
    columns:
      - name: old_player_id
        description: Alternate ATP player identifier for a person represented by another canoncial identifier. 
      - name: right_player_id
        description: Canonical ATP player identifier for teh same person in match and player bio data. 


  - name: atp_match_stat_corrections
    description: >
      Flags specific matches where serve stat columns (1stIn, 1stWon, svpt, etc.) were internally inconsistent (e.g. first serves won
      exceeding first serves in). Correct values couldn't be confidently determined, so the full serve-stat block is nulled in staging for
      these matches rather than guessed at.
    columns:
      - name: tourney_id
        description: Tournament identifier for the affected match.
      - name: tourney_match_num
        description: Match number within the tournament, used with tourney_id to identify the specific match.
      - name: winner_id_fixed
        description: Canonical ATP player identifier for the winner of the affected match.
      - name: reason
        description: Explanation of what was inconsistent and why the row was flagged.


  - name: wta_match_stat_corrections
    description: >
      Flags specific matches where serve stat columns (1stIn, 1stWon, svpt, etc.) were internally inconsistent (e.g. first serves won
      exceeding first serves in). Correct values couldn't be confidently determined, so the full serve-stat block is nulled in staging for
      these matches rather than guessed at.
    columns:
      - name: tourney_id
        description: Tournament identifier for the affected match.
      - name: tourney_match_num
        description: Match number within the tournament, used with tourney_id to identify the specific match.
      - name: winner_id
        description: Player identifier for the winner of the affected match.
      - name: reason
        description: Explanation of what was inconsistent and why the row was flagged.


  - name: draw_size_corrections
    description: Approved corrections to tournament draw sizes for events with inaccurate source records.
    columns:
      - name: tour
        description: Professional tennis tour associated with the tournament event.
      - name: tourney_id_raw
        description: Source tournament identifier for the event requiring a draw-size correction.
      - name: corrected_draw_size
        description: Confirmed number of player slots in the tournament draw.
      - name: reason
        description: Evidence supporting the corrected tournament draw size.


  - name: tourney_level_corrections
    description: Approved corrections to tournament competition levels for event years with inaccurate source records.
    columns:
      - name: tourney_name
        description: Tournament name for the event requiring a competition-level correction.
      - name: tourney_year
        description: Calendar year in which the tournament was held.
      - name: bad_tourney_level
        description: Competition level recorded incorrectly in the source data.
      - name: correct_tourney_level
        description: Confirmed competition level for the tournament event.
      - name: reason
        description: Evidence supporting the corrected competition level.


  - name: tourney_name_mapping
    description: Maps source tournament-name variants to a consistent tournament name for reporting and analysis.
    columns:
      - name: source_tourney_name
        description: Tournament name as recorded in the source data.
      - name: standard_tourney_name
        description: Standard tournament name used for consistent reporting and analysis.


  - name: reviewed_player_identity_pairs
    description: >
      Reviewed player ID and name combinations that legitimately participate
      in identity collisions found in the source match data.
    columns:
      - name: player_id
        description: "ATP player identifier for the reviewed identity record."
        data_tests:
          - not_null
      - name: player_name
        description: "Player name reviewed in combination with the player identifier."
        data_tests:
          - not_null
      - name: review_type
        description: "Category of the reviewed identity relationship, such as a shared name or spelling variant."
      - name: reason
        description: "Evidence supporting the identity review outcome."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - player_name


  - name: atp_player_name_corrections
    description: >
      Reviewed corrections for isolated player-name errors in ATP match data.
      Corrections are applied using the tournament, match number, player side,
      player ID and original name.
    columns:
      - name: tourney_id
        description: "Tournament identifier for the match with a player-name correction."
        data_tests:
          - not_null
      - name: tourney_match_num
        description: "Match number within the tournament for the corrected record."
        data_tests:
          - not_null
      - name: player_side
        description: "Match participant whose name is corrected: winner or loser."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['winner', 'loser']
      - name: player_id
        description: "ATP player identifier for the participant with the corrected name."
        data_tests:
          - not_null
      - name: bad_player_name
        description: "Player name recorded incorrectly in the source match data."
        data_tests:
          - not_null
      - name: correct_player_name
        description: "Approved player name for the match record."
        data_tests:
          - not_null
      - name: reason 
        description: "Evidence supporting the player-name correction."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tourney_id
              - tourney_match_num
              - player_side
              - player_id
